<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KanbanMail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- First run: account details -->
  <section id="login" class="screen" hidden>
    <form id="login-form" class="login-card">
      <h1>KanbanMail</h1>
      <p class="muted">Connect your mailbox. The password is stored in the system keychain.</p>
      <label>Email address
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label>IMAP server (port 993, SSL/TLS)
        <input id="login-server" type="text" placeholder="mail.yourdomain.com" required>
      </label>
      <label>Password
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button id="login-submit" type="submit" class="primary">Connect</button>
    </form>
  </section>

  <!-- Board -->
  <section id="board-screen" class="screen" hidden>
    <header class="topbar">
      <button id="toggle-sidebar" title="Show/hide folders (Ctrl/⌘+B)">☰</button>
      <div class="brand">KanbanMail</div>
      <div id="sync-status" class="muted"></div>
      <div class="spacer"></div>
      <label class="toggle"><input id="only-unread" type="checkbox"> Unread only</label>
      <button id="compose" class="primary" title="Write a new email">✉ New email</button>
      <button id="refresh" title="Refresh all columns">↻ Refresh</button>
      <button id="open-settings" title="Settings">⚙</button>
    </header>
    <div class="body-row">
      <aside id="sidebar" class="sidebar">
        <button id="nav-board" class="nav-item active">▦ Board</button>
        <div class="nav-title muted">Folders</div>
        <nav id="folder-list"></nav>
      </aside>
      <main id="board" class="board"></main>
    </div>
    <footer class="footer muted"><span id="account-email"></span> · columns are configured in <code id="config-path"></code> (restart the app after editing).</footer>
  </section>

  <!-- Initial loading -->
  <section id="loading" class="screen center">
    <p class="muted" id="loading-text">Starting…</p>
  </section>

  <!-- Reading an email -->
  <div id="reader" class="reader-backdrop" hidden>
    <article class="reader">
      <header class="reader-head">
        <h2 id="reader-subject"></h2>
        <button id="reader-close" title="Close (Esc)">✕</button>
      </header>
      <dl class="reader-meta">
        <dt>From</dt><dd id="reader-from"></dd>
        <dt>To</dt><dd id="reader-to"></dd>
        <dt id="reader-cc-label">Cc</dt><dd id="reader-cc"></dd>
        <dt>Date</dt><dd id="reader-date"></dd>
      </dl>
      <div class="reader-actions">
        <button id="reader-reply">↩ Reply</button>
        <button id="reader-reply-all">↩ Reply all</button>
        <button id="reader-seen"></button>
        <button id="reader-trash" title="Move to trash">🗑 Delete</button>
        <span id="reader-seen-hint" class="muted"></span>
      </div>
      <div class="reader-tools">
        <span class="muted">Images and remote content blocked.</span>
        <button id="reader-toggle" hidden></button>
      </div>
      <div id="reader-body" class="reader-body"></div>
    </article>
  </div>

  <!-- Writing an email -->
  <div id="composer" class="reader-backdrop" hidden>
    <form id="compose-form" class="reader composer">
      <header class="reader-head">
        <h2 id="compose-title">New email</h2>
        <button type="button" id="compose-close" title="Close">✕</button>
      </header>
      <div class="compose-fields">
        <label>To <input id="compose-to" type="text" placeholder="name@example.com, other@example.com" autocomplete="off" required></label>
        <label>Cc <input id="compose-cc" type="text" autocomplete="off"></label>
        <label>Subject <input id="compose-subject" type="text"></label>
      </div>
      <textarea id="compose-body" spellcheck="true"></textarea>
      <footer class="compose-foot">
        <span class="muted" id="compose-from"></span>
        <span class="spacer"></span>
        <button type="button" id="compose-cancel">Cancel</button>
        <button type="submit" id="compose-send" class="primary">Send</button>
      </footer>
    </form>
  </div>

  <!-- Settings -->
  <div id="settings" class="reader-backdrop" hidden>
    <form id="settings-form" class="login-card settings-card">
      <h2>Settings</h2>
      <p class="muted" id="settings-email"></p>
      <label>Sender name (optional)
        <input id="set-name" type="text" placeholder="Jane Doe">
      </label>
      <label>SMTP server for sending
        <input id="set-smtp" type="text" required>
      </label>
      <label>SMTP port
        <select id="set-port">
          <option value="465">465 (SSL/TLS)</option>
          <option value="587">587 (STARTTLS)</option>
        </select>
      </label>
      <label>Signature
        <textarea id="set-signature" rows="4" placeholder="Jane Doe&#10;Example Inc. · +1 ..."></textarea>
      </label>
      <label class="toggle"><input id="set-contacts" type="checkbox"> Suggest addresses from the address book (macOS Contacts)</label>
      <label>Mark as read after (seconds)
        <input id="set-seconds" type="number" min="0" max="600" step="1">
      </label>
      <label class="toggle"><input id="set-never" type="checkbox"> Never automatically (manual only)</label>
      <p class="muted small">Columns: edit <code id="settings-config-path"></code> and restart the app.</p>
      <div class="settings-buttons">
        <button type="button" id="logout" class="danger">Disconnect account</button>
        <span class="spacer"></span>
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>

  <ul id="suggestions" class="suggestions" hidden></ul>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
