<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8ff"/>
      <stop offset="1" stop-color="#2f5bd8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2a6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle background with a soft top sheen -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <!-- Three kanban columns of decreasing height -->
  <g filter="url(#shadow)">
    <rect x="232" y="262" width="160" height="500" rx="40" fill="url(#glass)"/>
    <rect x="432" y="262" width="160" height="380" rx="40" fill="url(#glass)" fill-opacity="0.85"/>
    <rect x="632" y="262" width="160" height="260" rx="40" fill="url(#glass)" fill-opacity="0.7"/>
  </g>
  <!-- Envelope on the first column -->
  <rect x="262" y="302" width="100" height="72" rx="14" fill="none" stroke="#2f5bd8" stroke-width="14"/>
  <path d="M268 312 L312 346 L356 312" fill="none" stroke="#2f5bd8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Card lines -->
  <g stroke="#2f5bd8" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round">
    <path d="M272 430h80M272 480h56M472 312h80M472 362h56M672 312h80M672 362h56"/>
  </g>
</svg>
