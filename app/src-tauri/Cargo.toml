[package]
name = "kanbanmail"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
kanbanmail-core = { version = "1.2.1", path = "../../crates/kanbanmail-core" }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-contacts = { version = "0.3.2", features = ["CNContactStore", "CNContact", "CNContactFetchRequest", "CNLabeledValue", "CNContactFormatter", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSError"] }
