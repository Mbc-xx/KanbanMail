[package]
name = "kanbanmail-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
directories = "6.0.0"
futures = "0.3.34"
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "hostname", "ring", "webpki-roots"] }
mail-parser = "1.0.0"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "1.1.8"
url = "2"
webpki-roots = "1.0.11"
